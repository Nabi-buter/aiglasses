name: Test pipeline

on:
  push:
    paths: ["training/**", "tests/**", "web/pipeline.js", ".github/workflows/test.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2
      - name: Python dependencies
        run: pip install -r training/requirements.txt scikit-image
      - name: Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Synthetic train + Python/browser parity
        run: python tests/test_pipeline.py --browser
