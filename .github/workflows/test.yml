name: Test pipeline

on:
  push:
    paths: ["training/**", "tests/**", "web/**", "contributions/**", ".github/workflows/test.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2
      - name: Python dependencies
        run: pip install -r training/requirements.txt scikit-image
      - name: Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Unit tests (tracker, zip)
        run: node --test tests/tracker.test.mjs
      - name: In-browser training matches scikit-learn
        run: python tests/logreg_parity.py
      - name: Shared-model contributions (merge, dedupe, reject tampered, quality gate)
        run: python tests/test_contributions.py
      - name: Synthetic train + Python/browser parity + live view + in-browser training
        run: python tests/test_pipeline.py --browser
