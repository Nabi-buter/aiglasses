name: Deploy web app to GitHub Pages

# Deploys web/ whenever main changes, e.g. after uploading a contribution file to contributions/
# or a new model through the GitHub website. Every deploy merges ALL contributions with the
# public base data and retrains the shared model (training/merge_contributions.py), so every
# device gets a model that grows with every supervisor's data.
# The github-pages environment only accepts deployments from main.
on:
  push:
    paths: ["web/**", "contributions/**", "training/merge_contributions.py", "training/basekit.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs like GitHub's starter workflow: deploy-pages in the same job as the
# upload can look for the artifact before it is visible and fail.
jobs:
  build:
    if: github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn
      - name: Merge user contributions and retrain the shared model
        shell: bash
        run: |
          status=0
          python training/merge_contributions.py --report "$RUNNER_TEMP/contributions.md" || status=$?
          cat "$RUNNER_TEMP/contributions.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit $status
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
