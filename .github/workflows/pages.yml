name: Deploy web app to GitHub Pages

# Deploys web/ whenever main (or the repository's default branch) changes,
# for example after uploading a new web/models/head.json through the GitHub website.
# The github-pages environment only accepts deployments from main.
on:
  push:
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs like GitHub's starter workflow: deploy-pages in the same job as the
# upload can look for the artifact before it is visible and fail.
jobs:
  build:
    if: github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
